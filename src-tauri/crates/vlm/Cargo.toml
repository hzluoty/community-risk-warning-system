[package]
name = "crws-vlm"
version.workspace = true
edition.workspace = true
description = "险封·社区风险预警平台 —— VLM 进程监管：llama-server 生命周期、就绪状态、退避与资源轮询。零 tauri 依赖，零 axum 依赖（进程管理，不做 HTTP）。"

[dependencies]
crws-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["process", "macros", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
